
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Menu | KAGINOLO Catering</title>
<meta name="description" content="Explore the KAGINOLO Catering platter collection.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --black: #10100f;
  --panel: #191917;
  --gold: #c9a45c;
  --cream: #f3eee4;
  --muted: #aaa49a;
  --line: rgba(201,164,92,.25);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--black);
  color: var(--cream);
  font-family: Arial, sans-serif;
}

header {
  min-height: 76px;
  padding: 18px 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}

.logo {
  color: var(--gold);
  font-family: Georgia, serif;
  font-size: 23px;
  letter-spacing: 3px;
  font-weight: bold;
}

.home-link {
  color: var(--cream);
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 1px;
}

.hero {
  text-align: center;
  padding: 48px 16px 30px;
}

.eyebrow {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(34px, 7vw, 52px);
  font-weight: normal;
  margin: 12px 0;
}

.hero p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  max-width: 420px;
  margin: auto;
}

.gold-line {
  width: 45px;
  height: 1px;
  background: var(--gold);
  margin: 20px auto 0;
}

main {
  width: min(1100px, 92%);
  margin: 0 auto 65px;
}

.menu-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 15px 0 18px;
}

.menu-heading h2 {
  font-family: Georgia, serif;
  font-size: 19px;
  font-weight: normal;
  margin: 0;
}

.menu-heading span {
  color: var(--muted);
  font-size: 11px;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  min-width: 0;
  overflow: hidden;
}

.card-image {
  width: 100%;
  aspect-ratio: 1 / .83;
  background: #24231f;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.card-content {
  padding: 12px;
}

.card-category {
  color: var(--gold);
  font-size: 8px;
  letter-spacing: 1.7px;
  text-transform: uppercase;
  margin-bottom: 7px;
}

.card h3 {
  font-family: Georgia, serif;
  font-size: 16px;
  font-weight: normal;
  line-height: 1.3;
  margin: 0 0 8px;
}

.description {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  margin: 0 0 9px;
}

.card-meta {
  color: var(--muted);
  font-size: 10px;
  margin-bottom: 10px;
}

.price {
  color: var(--gold);
  font-family: Georgia, serif;
  font-size: 19px;
  margin: 10px 0;
}

details {
  margin: 8px 0;
  border-top: 1px solid var(--line);
  padding-top: 8px;
}

summary {
  color: var(--gold);
  font-size: 10px;
  cursor: pointer;
}

.full-description {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  padding-top: 8px;
}

.enquire {
  display: block;
  width: 100%;
  padding: 11px 5px;
  background: var(--gold);
  color: #111;
  text-decoration: none;
  text-align: center;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 12px;
}

.enquire:active {
  opacity: .8;
}

.status {
  text-align: center;
  color: var(--muted);
  padding: 35px 10px;
  font-size: 13px;
  grid-column: 1 / -1;
}

footer {
  border-top: 1px solid var(--line);
  text-align: center;
  padding: 25px 15px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1px;
}

footer strong {
  color: var(--gold);
  font-weight: normal;
}

@media (min-width: 760px) {
  .menu-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
  }

  .card-content {
    padding: 17px;
  }

  .card h3 {
    font-size: 20px;
  }

  .description {
    font-size: 12px;
  }
}

@media (max-width: 360px) {
  .menu-grid {
    gap: 8px;
  }

  .card-content {
    padding: 9px;
  }

  .card h3 {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">KAGINOLO</div>
  <a class="home-link" href="index.html">← BACK HOME</a>
</header>

<section class="hero">
  <div class="eyebrow">THE KAGINOLO COLLECTION</div>
  <h1>Our Menu</h1>
  <p>Thoughtfully prepared platters, made for sharing and memorable occasions.</p>
  <div class="gold-line"></div>
</section>

<main>
  <div class="menu-heading">
    <h2>Our Platters</h2>
    <span id="item-count"></span>
  </div>

  <section class="menu-grid" id="menu-grid">
    <div class="status">Preparing our collection...</div>
  </section>
</main>

<footer>
  <strong>KAGINOLO CATERING</strong>
  <p>MADE FOR SHARING. PREPARED WITH CARE.</p>
</footer>

<script>
const SUPABASE_URL = "https://psmsmscsfcaetyayqkty.supabase.co";
const SUPABASE_KEY = "sb_publishable_nc6RlN8ZAEzEnGbw_u-oXg_J8Www63k";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const grid = document.getElementById("menu-grid");
const count = document.getElementById("item-count");

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function money(value) {
  if (value === null || value === undefined || value === "") {
    return "Price on request";
  }

  const number = Number(value);

  return Number.isFinite(number)
    ? "R" + number.toLocaleString("en-ZA")
    : safeText(value);
}

function renderCard(item) {
  const name = safeText(item.name);
  const description = safeText(item.description || "Prepared with care by KAGINOLO.");
  const serves = item.serves
    ? "Serves " + safeText(item.serves)
    : "Made for sharing";

  const image = item.image_url
    ? `<img src="${safeText(item.image_url)}" alt="${name}" loading="lazy">`
    : "";

  const enquiryLink = "index.html?platter=" +
    encodeURIComponent(item.name || "") + "#contact";

  return `
    <article class="card">
      <div class="card-image">${image}</div>

      <div class="card-content">
        <div class="card-category">KAGINOLO COLLECTION</div>

        <h3>${name}</h3>

        <p class="description">${description}</p>

        <div class="card-meta">${serves}</div>

        <div class="price">${money(item.price)}</div>

        <details>
          <summary>VIEW DETAILS</summary>
          <div class="full-description">${description}</div>
        </details>

        <a class="enquire" href="${enquiryLink}">
          Enquire Now
        </a>
      </div>
    </article>
  `;
}

async function loadMenu() {
  try {
    const { data, error } = await supabaseClient
      .from("menu_items")
      .select("id,name,description,price,serves,image_url")
      .eq("is_published", true)
      .order("created_at", { ascending: false });

    if (error) throw error;

    if (!data || data.length === 0) {
      grid.innerHTML = `
        <div class="status">
          Our menu is being updated. Please check back soon.
        </div>
      `;
      count.textContent = "";
      return;
    }

    count.textContent = data.length + " PLATTER" +
      (data.length === 1 ? "" : "S");

    grid.innerHTML = data.map(renderCard).join("");

  } catch (error) {
    console.error("Menu loading error:", error);

    grid.innerHTML = `
      <div class="status">
        Our menu is temporarily unavailable.
        Please try again shortly.
      </div>
    `;
  }
}

loadMenu();
</script>

</body>
</html>
