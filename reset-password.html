
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAGINOLO - Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 14px;
      width: 85%;
      max-width: 380px;
      box-shadow: 0 4px 20px #0001;
    }
    h2 { text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #174d32;
      color: white;
      font-weight: bold;
    }
    #message { margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>KAGINOLO</h2>
    <p>Choose your new password.</p>

    <input id="password" type="password"
      placeholder="New password" autocomplete="new-password">

    <input id="confirm" type="password"
      placeholder="Confirm new password" autocomplete="new-password">

    <button onclick="resetPassword()">Update Password</button>
    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://psmsmscsfcaetyayqkty.supabase.co";

    const SUPABASE_KEY ="sb_publishable_nc6RlN8ZAEzEnGbw_u-oXg_J8Www63k";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function resetPassword() {
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const message = document.getElementById("message");

      if (password.length < 8) {
        message.textContent = "Use at least 8 characters.";
        return;
      }

      if (password !== confirm) {
        message.textContent = "Passwords do not match.";
        return;
      }

      message.textContent = "Updating password...";

      const { error } = await client.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent =
        "Password updated! You can now log in to KAGINOLO Admin.";
    }
  </script>
</body>
</html>
